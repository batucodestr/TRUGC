services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trugc}
      POSTGRES_USER: ${POSTGRES_USER:-trugc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trugc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trugc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request,sys
          req=urllib.request.Request(
              "http://localhost:8000/healthz/",
              headers={"X-Forwarded-Proto":"https","Host":"trugc.com.tr"}
          )
          sys.exit(0 if urllib.request.urlopen(req, timeout=8).status==200 else 1)
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    expose:
      - "8000"
    networks:
      - internal

  celery_worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file: .env
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  celery_beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - "3000"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - static_data:/srv/static
      - media_data:/srv/media
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config: